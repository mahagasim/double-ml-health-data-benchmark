name: tests

on:
  push:
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install pinned CI environment
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-ci-pinned.txt
          pip install -e . --no-deps
      - name: Run tests
        run: pytest
      - name: Verify frozen result artifacts
        run: python scripts/verify_frozen_results.py

  doubleml-validation:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install validation environment
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-ci-pinned.txt
          pip install "doubleml==0.11.4"
          pip install -e . --no-deps
      - name: Compare manual PLR with DoubleMLPLR
        run: python scripts/validate_doubleml.py
